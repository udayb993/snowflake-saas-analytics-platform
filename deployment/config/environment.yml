# Environment Configuration
# Set the environment below: dev, qa, or prod
# This controls which database name is used across all SQL files

environment: dev

# Database naming convention
database_names:
  dev: SAAS_ANALYTICS_DEV
  qa: SAAS_ANALYTICS_QA
  prod: SAAS_ANALYTICS_PROD

# Warehouse configuration (same across environments)
warehouse: SAAS_WH

# All schemas remain the same across environments
schemas:
  - BRONZE
  - SILVER
  - GOLD
  - COMMON
  - GOVERNANCE

# Roles (same across environments)
roles:
  - ANALYST_ROLE
  - QA_ROLE
  - DEVELOPER_ROLE

# Tenants (same across environments)
# AWS Storage Integration Configuration (environment-specific)
storage_integration:
  dev:
    aws_role_arn: 'arn:aws:iam::{{AWS_ACCOUNT_ID}}:role/snowflake-saas-analytics-role'
    allowed_locations:
      - 's3://snowflake-saas-analytics-data-dev/'
    stage_url: 's3://snowflake-saas-analytics-data-dev/raw/'
  qa:
    aws_role_arn: 'arn:aws:iam::{{AWS_ACCOUNT_ID}}:role/snowflake-saas-analytics-role'
    allowed_locations:
      - 's3://snowflake-saas-analytics-data-qa/'
    stage_url: 's3://snowflake-saas-analytics-data-qa/raw/'
  prod:
    aws_role_arn: 'arn:aws:iam::{{AWS_ACCOUNT_ID}}:role/snowflake-saas-analytics-role'
    allowed_locations:
      - 's3://snowflake-saas-analytics-data-prod/'
    stage_url: 's3://snowflake-saas-analytics-data-prod/raw/'
